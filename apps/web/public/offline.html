<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — GEM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #030712;
      color: #e5e7eb;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: #f9fafb; }
    p { font-size: 0.95rem; color: #9ca3af; max-width: 24rem; line-height: 1.6; }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.4rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h1>You're offline</h1>
  <p>GEM couldn't reach the server. Check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
